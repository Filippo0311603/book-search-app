name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # No separate typecheck script: `tsc -b` runs as part of the build below.
      - name: Test
        run: npm test

      # The build regenerates src/styles/main.css from the SCSS; the committed copy must match.
      - name: Build (build:css + tsc -b + vite build)
        run: npm run build

      - name: Check the committed CSS is up to date
        run: git ls-files --error-unmatch src/styles/main.css && git diff --exit-code src/styles/main.css
